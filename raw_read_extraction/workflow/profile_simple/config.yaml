cluster: "sbatch --account={resources.slurm_account} --time={resources.runtime} --mem-per-cpu={resources.mem_per_cpu} --cpus-per-task={threads} --output=logs/slurm-%j.out"
default-resources:
  slurm_account: "'es_beere'"
  runtime: 360
  mem_per_cpu: 1250
restart-times: 3
max-jobs-per-second: 10
max-status-checks-per-second: 10
local-cores: 1
latency-wait: 120
jobs: 300
keep-going: True
rerun-incomplete: True
printshellcmds: True
use-conda: True
